<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="cssfile.css">
</head>
<body>
    <main class="app">
        <h1>Todo App</h1>
        <form id="add-form">
            <input id="name" placeholder="What needs doing?" aria-label="New todo" autocomplete="off">
            <button id="add" type="submit">Add</button>
        </form>
        <div class="toolbar">
            <p>Tip: double-click a todo to edit. Press Enter to save.</p>
            <div class="filters" aria-label="Filter todos">
                <button type="button" data-filter="all" class="selected" aria-pressed="true">All</button>
                <button type="button" data-filter="active" aria-pressed="false">Active</button>
                <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>
        </div>
        <ul id="list"></ul>
        <footer>
            <span id="count" aria-live="polite">0 items left</span>
            <div>
                <button id="clear-completed" type="button">Clear completed</button>
                <button id="clear-all" type="button">Clear all</button>
            </div>
        </footer>
    </main>
    <script>
        const list = document.getElementById('list');
        const input = document.getElementById('name');
        let filter = 'all';

        // Count unfinished tasks and apply the selected filter.
        function updateList() {
            let remaining = 0;
            for (const li of list.children) {
                const done = li.querySelector('input').checked;
                if (!done) remaining++;
                li.classList.toggle('completed', done);
                li.hidden = (filter === 'active' && done) ||
                            (filter === 'completed' && !done);
            }
            document.getElementById('count').textContent = remaining + ' items left';
        }

        // Create a task, just like creating a name in the reservations project.
        function addTodo(name) {
            const li = document.createElement('li');
            li.innerHTML = '<input type="checkbox" aria-label="Complete task"><span class="todo-text" tabindex="0"></span><button class="remove" aria-label="Delete task">🗑</button>';
            const text = li.querySelector('span');
            text.textContent = name;
            li.querySelector('input').onchange = updateList;
            li.querySelector('button').onclick = function() {
                li.remove();
                updateList();
            };

            // Double-click to edit; Enter saves the text.
            text.ondblclick = function() {
                text.contentEditable = 'true';
                text.focus();
            };
            text.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    text.blur();
                }
            };
            text.onblur = function() {
                text.contentEditable = 'false';
                text.textContent = text.textContent.trim() || name;
                name = text.textContent;
            };
            list.appendChild(li);
            updateList();
        }

        document.getElementById('add-form').onsubmit = function(e) {
            e.preventDefault();
            if (!input.value.trim()) return;
            addTodo(input.value.trim());
            input.value = '';
        };

        document.querySelectorAll('[data-filter]').forEach(function(button) {
            button.onclick = function() {
                filter = button.dataset.filter;
                document.querySelectorAll('[data-filter]').forEach(function(item) {
                    item.classList.toggle('selected', item === button);
                    item.setAttribute('aria-pressed', item === button);
                });
                updateList();
            };
        });

        document.getElementById('clear-completed').onclick = function() {
            list.querySelectorAll('.completed').forEach(function(li) { li.remove(); });
            updateList();
        };
        document.getElementById('clear-all').onclick = function() {
            list.innerHTML = '';
            updateList();
        };

        addTodo('See Lecture');
        addTodo('Solve assignment');
    </script>
</body>
</html>
