<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="cssfile.css">
</head>
<body>
    <main class="app">
        <h1>Todo App</h1>
        <form id="add-form">
            <input id="name" placeholder="What needs doing?" aria-label="New todo" autocomplete="off">
            <button id="add" type="submit">Add</button>
        </form>
        <div class="toolbar">
            <p>Tip: double-click a todo to edit. Press Enter to save.</p>
            <div class="filters" aria-label="Filter todos">
                <button type="button" data-filter="all" class="selected" aria-pressed="true">All</button>
                <button type="button" data-filter="active" aria-pressed="false">Active</button>
                <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>
        </div>
        <ul id="list"></ul>
        <footer>
            <span id="count" aria-live="polite">0 items left</span>
            <div>
                <button id="clear-completed" type="button">Clear completed</button>
                <button id="clear-all" type="button">Clear all</button>
            </div>
        </footer>
    </main>
    <script>
        let filter = 'all';
        const list = document.getElementById('list');

        // Update the count and show the selected group of todos.
        function updateList() {
            let remaining = 0;
            for (const li of list.children) {
                const completed = li.querySelector('input[type="checkbox"]').checked;
                if (!completed) remaining++;
                li.classList.toggle('completed', completed);
                li.hidden = (filter === 'active' && completed) ||
                            (filter === 'completed' && !completed);
            }
            document.getElementById('count').textContent = remaining +
                (remaining === 1 ? ' item left' : ' items left');
        }

        // Add a todo, just like adding a name in the reservations project.
        function addTodo(name) {
            const li = document.createElement('li');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.setAttribute('aria-label', 'Mark ' + name + ' completed');
            checkbox.addEventListener('change', updateList);

            const text = document.createElement('span');
            text.className = 'todo-text';
            text.textContent = name;
            text.title = 'Double-click to edit';
            text.tabIndex = 0;

            function editTodo() {
                if (li.querySelector('.edit')) return;
                const input = document.createElement('input');
                input.className = 'edit';
                input.value = text.textContent;
                input.setAttribute('aria-label', 'Edit todo');
                text.hidden = true;
                li.insertBefore(input, text);
                input.focus();
                input.select();
                function finish(save) {
                    if (!input.isConnected) return;
                    if (save && input.value.trim()) text.textContent = input.value.trim();
                    checkbox.setAttribute('aria-label', 'Mark ' + text.textContent + ' completed');
                    input.remove();
                    text.hidden = false;
                }
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); finish(true); text.focus(); }
                    if (e.key === 'Escape') { finish(false); text.focus(); }
                });
                input.addEventListener('blur', function() { finish(true); });
            }
            text.addEventListener('dblclick', editTodo);
            text.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') editTodo();
            });

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'remove';
            remove.textContent = '🗑';
            remove.setAttribute('aria-label', 'Delete todo');
            remove.title = 'Delete todo';
            remove.addEventListener('click', function() {
                li.remove();
                updateList();
            });
            li.append(checkbox, text, remove);
            list.appendChild(li);
            updateList();
        }

        document.getElementById('add-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('name');
            const name = input.value.trim();
            if (!name) return;
            addTodo(name);
            input.value = '';
            input.focus();
        });
        document.querySelectorAll('[data-filter]').forEach(function(button) {
            button.addEventListener('click', function() {
                filter = button.dataset.filter;
                document.querySelectorAll('[data-filter]').forEach(function(item) {
                    const selected = item === button;
                    item.classList.toggle('selected', selected);
                    item.setAttribute('aria-pressed', selected);
                });
                updateList();
            });
        });
        document.getElementById('clear-completed').addEventListener('click', function() {
            for (const li of Array.from(list.children)) {
                if (li.querySelector('input[type="checkbox"]').checked) li.remove();
            }
            updateList();
        });
        document.getElementById('clear-all').addEventListener('click', function() {
            list.replaceChildren();
            updateList();
        });

        addTodo('See Lecture');
        addTodo('Solve assignment');
    </script>
</body>
</html>
